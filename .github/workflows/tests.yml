name: Tests

# Builds the production image, runs the testthat suite inside it (so the tests see
# the exact R and package versions that run in production; mocked HTTP and a local
# test server, no keys, no Google Cloud), and checks that the app starts and serves
# its page and assets. Runs on pull requests, on pushes that change the tests or
# this file, on demand, and as the first job of the deploy workflow (which only
# deploys if it passes).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: docker build -t trackteller-ci .

      - name: Run the unit tests inside the image
        run: tests/run_in_docker.sh trackteller-ci

      # No Spotify credentials: the page and its assets don't need them
      - name: Start the app and check it answers
        run: |
          docker run -d --name trackteller-ci -e PORT=8080 -p 8080:8080 trackteller-ci
          for attempt in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/ || true)
            echo "Attempt $attempt: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          [ "$CODE" = "200" ]
          curl -s http://127.0.0.1:8080/ | grep -q "Log in with Spotify"
          # The page carries the security headers; HSTS only when it came in over https
          HEADERS=$(curl -sI http://127.0.0.1:8080/)
          for header in "X-Frame-Options: DENY" "X-Content-Type-Options: nosniff" \
                        "Referrer-Policy: strict-origin-when-cross-origin" "Permissions-Policy: camera=()"; do
            echo "$HEADERS" | grep -qi "^$header" || { echo "Missing header: $header"; exit 1; }
          done
          if echo "$HEADERS" | grep -qi "^Strict-Transport-Security"; then echo "HSTS sent over plain http"; exit 1; fi
          curl -sI -H "X-Forwarded-Proto: https" http://127.0.0.1:8080/ | grep -qi "^Strict-Transport-Security: max-age=31536000"
          # The Content-Security-Policy (report-only until the policy has been checked against real
          # use) and the endpoint its reports go to
          echo "$HEADERS" | grep -qi "^Content-Security-Policy-Report-Only: default-src 'self'" || { echo "Missing CSP header"; exit 1; }
          echo "$HEADERS" | grep -qi "^Reporting-Endpoints: csp=" || { echo "Missing Reporting-Endpoints header"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/csp-report" \
            --data '{"csp-report":{"effective-directive":"img-src","blocked-uri":"https://x.example/a"}}' http://127.0.0.1:8080/csp-report)
          echo "POST /csp-report: HTTP $CODE"
          [ "$CODE" = "204" ]
          # /health: this container has no credentials, so it must say what is missing
          CODE=$(curl -s -o /tmp/health.txt -w '%{http_code}' http://127.0.0.1:8080/health)
          echo "/health without credentials: HTTP $CODE: $(cat /tmp/health.txt)"
          [ "$CODE" = "503" ]
          grep -q "SPOTIFY_CLIENT_ID" /tmp/health.txt
          for asset in www/redirect.js www/favicon.png; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:8080/$asset")
            echo "$asset: HTTP $CODE"
            [ "$CODE" = "200" ]
          done

      # The same image with made-up credentials of the right shape and an https address: healthy
      - name: Check /health on a configured container
        run: |
          docker run -d --name trackteller-ci-configured -e PORT=8080 -p 8081:8080 \
            -e SPOTIFY_CLIENT_ID=0123456789abcdef0123456789abcdef \
            -e SPOTIFY_CLIENT_SECRET=fedcba9876543210fedcba9876543210 \
            -e APP_URL=https://example.test trackteller-ci
          for attempt in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.txt -w '%{http_code}' --max-time 5 http://127.0.0.1:8081/health || true)
            echo "Attempt $attempt: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          [ "$CODE" = "200" ]
          [ "$(cat /tmp/health.txt)" = "ok" ]

      - name: App log (on failure)
        if: failure()
        run: |
          docker logs trackteller-ci
          docker logs trackteller-ci-configured || true
